
name: Build and publish multi-arch image

on:
  push:
    branches: [demo/ghcr]

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            uname: x86_64
            node_arch: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
            node_arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image reference
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ghostty-web" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          TAG="$IMAGE:$GITHUB_SHA-${{ matrix.arch }}"

          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            -f docker/Dockerfile \
            -t "$TAG" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --load .

      - name: Smoke test
        run: |
          TAG="$IMAGE:$GITHUB_SHA-${{ matrix.arch }}"

          test "$(docker run --rm --entrypoint uname "$TAG" -m)" = "${{ matrix.uname }}"

          test "$(docker run --rm --entrypoint node "$TAG" -p process.arch)" = "${{ matrix.node_arch }}"

          docker run --rm --entrypoint /bin/sh "$TAG" -c \
            'cd /opt/ghostty-web && node -e "import(\"@lydell/node-pty\")" && oscar-cli --help >/dev/null'

      - name: Push image
        run: |
          docker push "$IMAGE:$GITHUB_SHA-${{ matrix.arch }}"

  manifest:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image reference
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ghostty-web" >> "$GITHUB_ENV"

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$GITHUB_SHA" \
            "$IMAGE:$GITHUB_SHA-amd64" \
            "$IMAGE:$GITHUB_SHA-arm64"

      - name: Verify manifest
        run: |
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA"
